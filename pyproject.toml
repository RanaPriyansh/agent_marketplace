[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_marketplace"
version = "1.0.0"
description = "Agent Marketplace Protocol (AMP) – Token-based service registry for autonomous agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "RanaPriyansh"}]
keywords = ["agents", "marketplace", "tokens", "reputation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []
[project.urls]
Homepage = "https://github.com/RanaPriyansh/agent_marketplace"
Repository = "https://github.com/RanaPriyansh/agent_marketplace"
Issues = "https://github.com/RanaPriyansh/agent_marketplace/issues"
[project.scripts]
agent-marketplace = "agent_marketplace.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
